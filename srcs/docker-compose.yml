services:
  wordpress:
    build: ./requirements/wordpress
    env_file:
      - .env
    container_name: wordpress
    restart: unless-stopped
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - docker-network

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - docker-network

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - docker-network

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aylaaouf/data/db_data
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aylaaouf/data/wordpress_data

networks:
  docker-network:
    driver: bridge
